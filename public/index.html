<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A股智能投资管理系统</title><style>
:root{--bg:#0b1020;--p:#121a2d;--p2:#18223a;--t:#e8edf7;--m:#91a0bb;--l:#293653;--up:#ef6b73;--dn:#45c79a;--a:#6ea8fe}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,"Microsoft YaHei",sans-serif}header{height:62px;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 22px;background:#0d1426;position:sticky;top:0;z-index:3}.brand{font-size:18px;font-weight:700}nav{margin-left:35px;display:flex;gap:5px}button,.btn{border:0;background:transparent;color:var(--m);padding:8px 12px;border-radius:7px;cursor:pointer}button.active,button:hover,.primary{background:#203456;color:#fff}main{max-width:1400px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:16px}.s4{grid-column:span 4}.s8{grid-column:span 8}.s12{grid-column:1/-1}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.muted{color:var(--m)}.big{font-size:30px;font-weight:700}.up{color:var(--up)}.dn{color:var(--dn)}input,select{background:#0d1528;color:#fff;border:1px solid var(--l);padding:9px;border-radius:7px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid var(--l);text-align:left}th{color:var(--m)}.metric{background:var(--p2);padding:10px;border-radius:8px;min-width:110px}.metric b{display:block;font-size:17px}.notice{padding:10px;background:#101a30;border-left:3px solid var(--a);border-radius:4px}.hide{display:none}canvas{width:100%;height:300px;background:#0d1528;border-radius:8px}@media(max-width:900px){.s4,.s8{grid-column:1/-1}nav{margin-left:8px;overflow:auto}.brand{font-size:15px}}
</style></head><body><header><div class="brand">A股智能投资管理</div><nav><button class="active" data-p="home">总览</button><button data-p="stock">个股分析</button><button data-p="hold">持仓</button><button data-p="alert">预警</button><button data-p="set">设置</button></nav></header><main>
<section id="home"><div class="grid"><div class="card s12"><h2>投资工作台</h2><div class="notice">数据事实与 AI 推理分离。当前默认使用东方财富公开行情接口；同花顺没有可验证的免费实时授权时，不会伪造数据。</div></div><div class="card s4"><h3>系统</h3><div id="sys">检查中…</div></div><div class="card s4"><h3>数据源</h3><div id="health">检查中…</div></div><div class="card s4"><h3>持仓</h3><div id="sum">检查中…</div></div><div class="card s12"><h3>快速分析</h3><div class="row"><input id="qc" placeholder="股票代码，如 300131"><button class="primary" onclick="goStock()">分析</button></div></div></div></section>
<section id="stock" class="hide"><div class="card"><div class="row"><h2 style="margin-right:auto">个股分析</h2><input id="sc" value="600519"><button class="primary" onclick="stock()">查询</button></div><div id="quote"></div><canvas id="chart"></canvas><div id="ana"></div></div></section>
<section id="hold" class="hide"><div class="grid"><div class="card s8"><h2>持仓</h2><div id="holds"></div></div><div class="card s4"><h2>录入交易</h2><p><input id="tc" placeholder="代码"></p><p><select id="ts"><option value="BUY">买入</option><option value="SELL">卖出</option></select> <input id="tp" type="number" placeholder="价格"></p><p><input id="tn" type="number" placeholder="数量"> <input id="tf" type="number" placeholder="费用"></p><button class="primary" onclick="trade()">保存</button></div></div></section>
<section id="alert" class="hide"><div class="card"><h2>预警中心</h2><div id="alerts"></div></div></section>
<section id="set" class="hide"><div class="card"><h2>AI / 数据源配置</h2><p class="muted">下一阶段接入可切换 AI 模型：Endpoint、API Key、Model ID、Temperature、Timeout 等。密钥只保留在 Worker 后端，不放进浏览器。</p><div class="notice">D1 绑定后本页即可保存模型配置与策略参数。</div></div></section>
</main><script>
const $=x=>document.querySelector(x);async function api(p,o){const r=await fetch(p,o),j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}const fmt=x=>x==null?'—':Number(x).toLocaleString(undefined,{maximumFractionDigits:2});
function page(p){document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('hide',x.id!==p));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));if(p==='home')home();if(p==='hold')loadHold();if(p==='alert')loadAlert()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>page(b.dataset.p));
async function home(){try{const [s,h,hs]=await Promise.all([api('/api/health'),api('/api/data-health'),api('/api/holdings')]);$('#sys').innerHTML='Worker：正常<br>D1：'+(s.db?'已绑定':'未绑定')+'<br>版本：'+s.version;$('#health').innerHTML=h.length?h.map(x=>x.source+'：'+x.status).join('<br>'):'尚未抓取';$('#sum').innerHTML='持仓：'+hs.length+' 个<br>市值：'+fmt(hs.reduce((a,x)=>a+(x.marketValue||0),0))+'<br>浮盈亏：'+fmt(hs.reduce((a,x)=>a+(x.pnl||0),0))}catch(e){$('#sys').textContent=e.message}}
function goStock(){let c=$('#qc').value.trim();if(c){$('#sc').value=c;page('stock');stock()}}
async function stock(){try{let c=$('#sc').value.trim(),[q,a]=await Promise.all([api('/api/quote?code='+c),api('/api/analyze?code='+c)]),cl=q.price>=q.prevClose?'up':'dn';$('#quote').innerHTML='<div class="row"><div><div class="muted">'+q.code+' '+q.name+'</div><div class="big '+cl+'">'+fmt(q.price)+'</div></div><div class="metric">涨跌<b class="'+cl+'">'+(q.prevClose?((q.price/q.prevClose-1)*100).toFixed(2)+'%':'—')+'</b></div><div class="metric">成交额<b>'+fmt(q.amount)+'</b></div><div class="metric">换手率<b>'+fmt(q.turnoverRate)+'%</b></div><div class="metric">PE<b>'+fmt(q.pe)+'</b></div><div class="metric">PB<b>'+fmt(q.pb)+'</b></div></div>';draw(a.kline);$('#ana').innerHTML='<h3>规则研判</h3><p>趋势：<b>'+a.indicators.trend+'</b>　MA5 '+fmt(a.indicators.ma5)+'　MA20 '+fmt(a.indicators.ma20)+'　MA60 '+fmt(a.indicators.ma60)+'</p><p>操作倾向：<b>'+a.conclusion.signal+'</b></p><p class="muted">风险项：'+(a.conclusion.risk.length?a.conclusion.risk.join('；'):'当前规则未发现明显警报。')+'</p>'}catch(e){$('#quote').textContent=e.message}}
function draw(r){let c=$('#chart'),x=c.getContext('2d'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;x.scale(d,d);x.clearRect(0,0,w,h);if(!r.length)return;let lo=Math.min(...r.map(a=>a.low)),hi=Math.max(...r.map(a=>a.high));let px=i=>20+i*(w-40)/(r.length-1),py=v=>h-20-(v-lo)/(hi-lo||1)*(h-40);x.strokeStyle='#6ea8fe';x.beginPath();r.forEach((a,i)=>i?x.lineTo(px(i),py(a.close)):x.moveTo(px(i),py(a.close)));x.stroke()}
async function loadHold(){let hs=await api('/api/holdings');$('#holds').innerHTML=hs.length?'<table><tr><th>代码</th><th>名称</th><th>数量</th><th>成本</th><th>现价</th><th>盈亏</th></tr>'+hs.map(h=>'<tr><td>'+h.code+'</td><td>'+h.name+'</td><td>'+fmt(h.shares)+'</td><td>'+fmt(h.avg_cost)+'</td><td>'+fmt(h.quote&&h.quote.price)+'</td><td class="'+((h.pnl||0)>=0?'up':'dn')+'">'+fmt(h.pnl)+' ('+(h.pnlPct==null?'—':h.pnlPct.toFixed(2)+'%')+')</td></tr>').join('')+'</table>':'暂无持仓'}
async function trade(){try{await api('/api/holdings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:$('#tc').value,side:$('#ts').value,price:+$('#tp').value,shares:+$('#tn').value,fee:+$('#tf').value})});loadHold()}catch(e){alert(e.message)}}
async function loadAlert(){let a=await api('/api/alerts');$('#alerts').innerHTML=a.length?a.map(x=>'<div class="notice" style="margin:8px 0"><b>['+x.level+'] '+x.title+'</b><br>'+x.detail+'<br><span class="muted">'+x.created_at+'</span></div>').join(''):'暂无预警'}
home();
</script></body></html>

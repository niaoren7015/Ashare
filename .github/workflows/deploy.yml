name: Deploy A-share AI Tracker

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install
      - name: Deploy Worker and static assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f21c21b5aa07452a54e78efb2002ca3a

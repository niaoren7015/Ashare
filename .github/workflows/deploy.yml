name: Deploy A-share AI Tracker

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Prevent older commits from deploying after a newer production build.
concurrency:
  group: ashare-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install
      - name: Validate Worker backend JavaScript syntax
        run: node --check src/index.js
      - name: Validate frontend inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.lastIndexOf('</script>');
          if (start < 0 || end <= start) throw new Error('No inline script found in public/index.html');
          new Function(html.slice(start + 8, end));
          console.log('Frontend inline JavaScript syntax passed');
          NODE
      - name: Deploy Worker and static assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f21c21b5aa07452a54e78efb2002ca3a
      - name: Smoke test deployed Worker health endpoint
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$WORKER_URL/api/health" -o /tmp/worker-health.json; then
              break
            fi
            sleep 2
          done
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/worker-health.json','utf8'));if(x.ok!==true||x.db!==true)process.exit(1);console.log('Worker health smoke test passed:',JSON.stringify({ok:x.ok,db:x.db,version:x.version,time:x.time}))"
        env:
          WORKER_URL: https://a-share-ai-tracker.parker-f21.workers.dev
      - name: Production smart-screen end-to-end acceptance (opt-in commit tag)
        if: contains(github.event.head_commit.message, '[screen-e2e]')
        timeout-minutes: 3
        run: |
          node <<'NODE'
          const base = process.env.WORKER_URL;
          (async () => {
            const universeSessionId = 'acceptance-' + Date.now().toString(36);
            for (let batch = 0; batch < 3; batch++) {
              const syncResponse = await fetch(base + '/api/screen-universe/batch?batch=' + batch, {
                method: 'POST',
                headers: {'content-type':'application/json','cache-control':'no-cache'},
                body: JSON.stringify({sessionId:universeSessionId}),
                signal: AbortSignal.timeout(90000)
              });
              const syncRaw = await syncResponse.text();
              let sync;
              try { sync = JSON.parse(syncRaw); } catch { throw new Error('Universe batch '+batch+' HTTP '+syncResponse.status+' non-JSON: '+syncRaw.slice(0,200)); }
              console.log('Universe batch:', JSON.stringify({batch,httpStatus:syncResponse.status,ok:sync.ok,count:sync.validStockCount,source:sync.source,error:sync.error||null}));
              if (!syncResponse.ok || sync.ok !== true || sync.validStockCount < 500) throw new Error('Universe batch '+batch+' failed');
            }
            const response = await fetch(base + '/api/ai/screen', {
              method: 'POST',
              headers: {'content-type':'application/json','cache-control':'no-cache'},
              body: JSON.stringify({universeSessionId}),
              signal: AbortSignal.timeout(150000)
            });
            const raw = await response.text();
            let x;
            try { x = JSON.parse(raw); } catch { throw new Error('HTTP '+response.status+' returned non-JSON: '+raw.slice(0,300)); }
            console.log('Smart-screen response:', JSON.stringify({
              httpStatus: response.status,
              ok: x.ok,
              error: x.error || null,
              stage: x.stage || null,
              elapsedMs: x.elapsedMs || null,
              universe: x.marketUniverse || null,
              analyzedCandidates: Array.isArray(x.results) ? x.results.length : null,
              actionableCount: x.actionableCount ?? null,
              sampleCodes: Array.isArray(x.results) ? x.results.map(r=>r.code).slice(0,8) : null
            }));
            if (!response.ok || x.ok !== true) throw new Error('Production smart-screen endpoint failed');
            if (!x.marketUniverse || x.marketUniverse.validStockCount < 4500 || x.marketUniverse.coveragePassed !== true) throw new Error('Full-market coverage gate failed');
            if (!Array.isArray(x.results) || x.results.length > 4 || x.results.some(r => r.screenGrade === 'D')) throw new Error('Visible finalists must exclude D-grade candidates and remain within the analysis cap');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
        env:
          WORKER_URL: https://a-share-ai-tracker.parker-f21.workers.dev
      - name: Production data-source smoke tests (informational)
        continue-on-error: true
        run: |
          node <<'NODE'
          const base = process.env.WORKER_URL;
          const tests = [
            ['Tencent quote', '/api/quote?code=600519', x => x.price > 0, x => ({source:x.source, code:x.code, name:x.name, price:x.price, fetchedAt:x.fetchedAt})],
            ['Daily K-line full-field quality', '/api/kline?code=600519&limit=20&mode=day', x => Array.isArray(x.rows) && x.rows.length >= 20 && x.rows.every(r => Number.isFinite(Number(r.close)) && Number(r.close) > 0) && (x.quality?.amountCoveragePct ?? 0) >= 80 && (x.quality?.turnoverCoveragePct ?? 0) >= 80, x => ({source:x.source, rows:x.rows?.length, latest:x.rows?.at(-1)?.date, quality:x.quality, warning:x.warning || null, primaryError:x.primaryError || null, note:'仅当价格、成交额和换手率字段覆盖均达标才标记通过'})],
            ['Intraday 5-minute K-line', '/api/kline?code=600519&mode=intraday', x => Array.isArray(x.rows) && x.rows.length > 0 && x.rows.every(r => Number.isFinite(Number(r.close)) && Number(r.close) > 0), x => ({source:x.source, rows:x.rows?.length, latest:x.rows?.at(-1)?.date, quality:x.quality, warning:x.warning || null, primaryError:x.primaryError || null})],
            ['Stock announcements', '/api/announcements?code=600519', x => x.ok === true && Array.isArray(x.rows) && x.rows.length > 0, x => ({source:x.source, rows:x.rows?.length, sample:x.rows?.slice(0,2).map(r=>({title:r.title,date:r.date,source:r.source})), warning:x.warning || null, primaryError:x.primaryError || null, error:x.error || null})],
            ['Stock money-flow history', '/api/flow?code=600519', x => x.ok === true && Array.isArray(x.rows) && x.rows.length >= 5 && Number.isFinite(x.latest?.mainNetInflow), x => ({source:x.source, host:x.host, historyDays:x.historyDays, period:x.period, latest:x.latest, validation:x.validation, error:x.error || null})],
            ['603345 stock money-flow history', '/api/flow?code=603345', x => x.ok === true && Array.isArray(x.rows) && x.rows.length >= 5 && Number.isFinite(x.latest?.mainNetInflow), x => ({source:x.source,host:x.host,historyDays:x.historyDays,period:x.period,latest:x.latest,error:x.error||null})],
            ['603345 sector membership + matched sector flow', '/api/sector-context?code=603345', x => x.ok === true && Array.isArray(x.boards) && x.boards.length > 0 && x.boards.some(b=>Number.isFinite(b.sectorFlow?.flow)), x => ({membershipSource:x.membershipSource,boards:x.boards?.map(b=>({code:b.code,name:b.name,flow:b.sectorFlow?.flow,changePct:b.sectorFlow?.changePct,source:b.sectorFlow?.source})),membershipError:x.membershipError,industry:x.industry,concept:x.concept})],
            ['603345 relevant stock news', '/api/news?category=stock&code=603345', x => x.ok === true && (x.newsRelevantCount||0) > 0, x => ({newsSource:x.newsSource,announcementSource:x.announcementSource,candidates:x.newsCandidateCount,relevant:x.newsRelevantCount,rows:x.rows?.length,errors:x.errors,relevanceNote:x.relevanceNote})],
            ['Industry sector fund flow', '/api/sector-flow?type=industry', x => x.ok === true && x.count > 0 && x.flowCoverage > 0 && x.rows.some(r => Number.isFinite(r.flow)), x => ({count:x.count, flowCoverage:x.flowCoverage, sample:x.rows?.slice(0,3).map(r=>({code:r.code,name:r.name,flow:r.flow,amount:r.amount,source:r.source})), error:x.error || null})],
            ['Concept sector fund flow', '/api/sector-flow?type=concept', x => x.ok === true && x.count > 0 && x.flowCoverage > 0 && x.rows.some(r => Number.isFinite(r.flow)), x => ({count:x.count, flowCoverage:x.flowCoverage, sample:x.rows?.slice(0,3).map(r=>({code:r.code,name:r.name,flow:r.flow,amount:r.amount,source:r.source})), error:x.error || null})],
            ['Domestic/A-share news', '/api/news?category=domestic', x => x.ok === true && Array.isArray(x.rows) && x.rows.length >= 5 && x.rows.every(r=>r.title && String(r.url||'').startsWith('http')), x => ({source:x.source, count:x.rows?.length, sample:x.rows?.slice(0,3).map(r=>({title:r.title,publishedAt:r.publishedAt,url:r.url,source:r.source})), sourceChecks:x.sourceChecks, error:x.error || null})],
            ['International news', '/api/news?category=international', x => x.ok === true && Array.isArray(x.rows) && x.rows.length >= 5 && x.rows.every(r=>r.title && String(r.url||'').startsWith('http')), x => ({source:x.source, count:x.rows?.length, sample:x.rows?.slice(0,3).map(r=>({title:r.title,publishedAt:r.publishedAt,url:r.url,source:r.source})), sourceChecks:x.sourceChecks, error:x.error || null})],
            ['Individual stock news', '/api/news?category=stock&code=600519', x => x.ok === true && Array.isArray(x.rows) && x.rows.some(r=>String(r.source||'').includes('stock-news')), x => ({newsSource:x.newsSource, announcementSource:x.announcementSource, count:x.rows?.length, sample:x.rows?.slice(0,3).map(r=>({title:r.title,date:r.date||r.publishedAt,url:r.url,source:r.source})), errors:x.errors, error:x.error || null})],
          ];
          (async () => {
            for (const [name, path, valid, summary] of tests) {
              try {
                const r = await fetch(base + path, { signal: AbortSignal.timeout(15000), headers: {'cache-control':'no-cache'} });
                const raw = await r.text();
                let x; try { x = JSON.parse(raw); } catch { throw new Error('HTTP '+r.status+' non-JSON: '+raw.slice(0,160)); }
                const ok = r.ok && valid(x);
                console.log((ok ? 'PASS ' : 'CHECK ') + name + ': ' + JSON.stringify({httpStatus:r.status, ...summary(x)}));
              } catch (e) {
                console.log('CHECK ' + name + ': ' + String(e?.message || e));
              }
            }
          })().catch(e => { console.log('CHECK production data tests: '+String(e?.message||e)); });
          NODE
        env:
          WORKER_URL: https://a-share-ai-tracker.parker-f21.workers.dev
